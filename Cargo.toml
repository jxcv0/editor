[package]
name = "editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "editor"
description = "A fast, modal Rust editor with terminal and GPU frontends"
license = "MIT"

[features]
default = []
gui = ["dep:ab_glyph", "dep:ttf-parser", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:futures-lite", "dep:wgpu", "dep:winit"]

[dependencies]
ab_glyph = { version = "0.2.32", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
egui = { version = "=0.33.3", optional = true }
egui-wgpu = { version = "=0.33.3", default-features = false, optional = true }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "wayland", "x11"], optional = true }
futures-lite = { version = "2.6.1", optional = true }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
winit = { version = "0.30.13", optional = true }
crossterm = "0.29"
crossbeam-channel = "0.5"
dirs = "6"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
