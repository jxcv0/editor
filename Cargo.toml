[package]
name = "editor"
version = "0.1.0"
edition = "2024"
default-run = "editor"
description = "A fast, modal Rust terminal editor"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.29"
crossbeam-channel = "0.5"
dirs = "6"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
